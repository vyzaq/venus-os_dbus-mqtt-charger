; CONFIG FILE
; GitHub: forked from mr-manuel/venus-os_dbus-mqtt-solar-charger,
; rewritten to publish as com.victronenergy.charger and to talk to a
; Huawei R4875G1 rectifier controlled by ESPHome (standalone-charger project).
;
; Remove the leading ';' to enable a setting.

[DEFAULT]
; Set logging level
; ERROR = errors only
; WARNING = ERROR + warnings (default)
; INFO = WARNING + running functions
; DEBUG = INFO + per-message data
logging = WARNING

; Device name shown in Venus UI
device_name = Huawei R4875G1

; Device VRM instance — must be unique across all dbus services
; Use 100..119 range for custom chargers
device_instance = 100

; Seconds without any new subscribed MQTT message before the driver exits
; (daemontools will then restart it). 0 = disabled (not recommended).
timeout = 60


[MQTT]
; IP or FQDN of the MQTT broker (for Venus local Mosquitto use 127.0.0.1)
broker_address = 127.0.0.1
broker_port = 1883

; TLS — leave commented for plain local Mosquitto on Venus
;tls_enabled = 1
;tls_path_to_ca = /data/keys/mosquitto.crt
;tls_insecure = 1

; Auth — leave commented unless you secured Mosquitto
;username = myuser
;password = mypassword


[ESPHOME]
; Topics published by the ESPHome standalone-charger project (default names
; auto-generated from sensor "name:" fields). Verify with:
;   mosquitto_sub -h 127.0.0.1 -t 'standalone-charger/#' -v
; If your ESPHome device has a different name, replace 'standalone-charger'.

; ── State topics we subscribe to ──
topic_dc_voltage     = standalone-charger/sensor/07_output_dc_voltage/state
topic_dc_current     = standalone-charger/sensor/06_output_dc_current/state
topic_dc_temperature = standalone-charger/sensor/08_output_temperature/state
topic_max_current    = standalone-charger/sensor/09_max_output_dc_current/state
topic_power_state    = standalone-charger/sensor/003_power_state/state
; Last-Will topic — ESPHome publishes 'online'/'offline' here automatically
topic_lwt            = standalone-charger/status

; ── Command topics we publish setpoints to (DVCC) ──
topic_cmd_dc_current_limit = standalone-charger/number/12_set_dc_current_limit/command
topic_cmd_voltage_limit    = standalone-charger/number/10_set_voltage_limit/command


[DVCC]
; Master switch — 1 enables the DVCC forwarder (Plan B).
;
; HOW IT WORKS:
; Venus DVCC only writes /Link/ChargeCurrent to solarcharger and VE.Bus
; services, not to com.victronenergy.charger. To make this driver follow
; DVCC anyway, we subscribe DIRECTLY on the SystemBus to:
;     user_ccl     = settings /Settings/SystemSetup/MaxChargeCurrent
;     user_cvl     = settings /Settings/SystemSetup/MaxChargeVoltage
;     bms_ccl      = battery.aggregate /Info/MaxChargeCurrent
;     bms_cvl      = battery.aggregate /Info/MaxChargeVoltage
;     multiplus_dc = system /Dc/Vebus/Current   (signed: + charging, − inverting)
;
; Then compute Huawei setpoint and publish to the ESPHome command topics.
;
; WARNING: This OVERRIDES any staged-charging logic in ESPHome (the
; stage1_current/stage2_current voltage-based steps). Both write to the
; same command topic; last writer wins. If you want Venus to be sole
; authority, also disable the ESPHome stages.
dvcc_control_enabled = 0

; ── Charge current strategy ──
; load_following (DEFAULT, RECOMMENDED):
;     Huawei_target = max(0, -multiplus_dc + min(user_ccl, bms_ccl))
;     "Net battery current" interpretation: user_ccl=0 means 'cover loads,
;     don't charge'; user_ccl=10 means 'cover loads + push 10 A into battery'.
;     This matches how DVCC works for native Victron chargers.
; simple:
;     Huawei_target = max(0, min(user_ccl, bms_ccl))
;     Naïve mode — Huawei's OUTPUT is limited to CCL regardless of inverter
;     load. Causes battery discharge when CCL < inverter load and Multi is
;     inverting. Use only for testing or systems without a MultiPlus.
mode = load_following

; Hard safety caps applied BEFORE forwarding DVCC setpoints to ESPHome.
; CCL is clamped to [0, max_dc_current_safety] — this is the absolute max
; that will be written to Huawei regardless of formula result.
; CVL outside [min, max] is IGNORED (not published).
;
; Tune to your battery: 16S LFP at 3.50 V/cell ≈ 56.0 V absorption,
; balancing at 56.8 V, never below BMS low-cell cut-off.
; Huawei R4875G1 physical max output is 75 A; pick lower for thermal headroom.
max_dc_current_safety = 60
max_dc_voltage_safety = 57.6
min_dc_voltage_safety = 48.0

; ── Damping (load_following anti-oscillation) ──
;
; Without damping, real-time signals from MultiPlus DC current can drive a
; feedback loop with Huawei: each Huawei setpoint change perturbs Multi's
; DC current, which we react to, which perturbs Multi again, etc. Three
; mechanisms break this:

; 1. Exponential moving average on multi_dc reading. Smaller alpha = stronger
;    smoothing. With 1Hz ItemsChanged signals:
;       alpha=0.1 → time constant ~10 sec  (very smooth, slow response)
;       alpha=0.25 → ~4 sec                (good default)
;       alpha=0.5 → ~2 sec                 (fast but more wobble)
;       alpha=1.0 → no smoothing
multi_dc_ema_alpha = 0.25

; 2. Hysteresis — only republish when setpoint moved by ≥ this. Increase if
;    you still see MQTT spam, decrease for tighter tracking.
hysteresis_ccl = 1.0
hysteresis_cvl = 0.05

; 3. Minimum interval between two MQTT publishes (seconds). Gives the
;    Multi+Huawei system time to settle before issuing the next command.
;    Voltage publishes (CVL) bypass this — they're rare and important.
min_publish_interval_seconds = 2.0

; Periodic re-evaluation interval (seconds). Defends against missed signals
; or transient service disappearance. 0 = disabled (rely only on signals).
heartbeat_seconds = 30

; ── dbus source overrides (advanced) ──
; Defaults match Venus v3.x with Dr-Gigavolt/dbus-aggregate-batteries.
; Override only if your aggregate service has a different name or your
; Venus version uses different paths.
;
;user_ccl_service   = com.victronenergy.settings
;user_ccl_path      = /Settings/SystemSetup/MaxChargeCurrent
;user_cvl_service   = com.victronenergy.settings
;user_cvl_path      = /Settings/SystemSetup/MaxChargeVoltage
;
;bms_service        = com.victronenergy.battery.aggregate
;bms_ccl_path       = /Info/MaxChargeCurrent
;bms_cvl_path       = /Info/MaxChargeVoltage
;
;multiplus_service  = com.victronenergy.system
;multiplus_dc_path  = /Dc/Vebus/Current
