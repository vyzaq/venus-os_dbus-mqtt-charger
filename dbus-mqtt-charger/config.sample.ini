; CONFIG FILE
; GitHub: forked from mr-manuel/venus-os_dbus-mqtt-solar-charger,
; rewritten to publish as com.victronenergy.charger and to talk to a
; Huawei R4875G1 rectifier controlled by ESPHome (standalone-charger project).
;
; Remove the leading ';' to enable a setting.

[DEFAULT]
; Set logging level
; ERROR = errors only
; WARNING = ERROR + warnings (default)
; INFO = WARNING + running functions
; DEBUG = INFO + per-message data
logging = WARNING

; Device name shown in Venus UI
device_name = Huawei R4875G1

; Device VRM instance — must be unique across all dbus services
; Use 100..119 range for custom chargers
device_instance = 100

; Seconds without any new subscribed MQTT message before the driver exits
; (daemontools will then restart it). 0 = disabled (not recommended).
timeout = 60


[MQTT]
; IP or FQDN of the MQTT broker (for Venus local Mosquitto use 127.0.0.1)
broker_address = 127.0.0.1
broker_port = 1883

; TLS — leave commented for plain local Mosquitto on Venus
;tls_enabled = 1
;tls_path_to_ca = /data/keys/mosquitto.crt
;tls_insecure = 1

; Auth — leave commented unless you secured Mosquitto
;username = myuser
;password = mypassword


[ESPHOME]
; Topics published by the ESPHome standalone-charger project (default names
; auto-generated from sensor "name:" fields). Verify with:
;   mosquitto_sub -h 127.0.0.1 -t 'standalone-charger/#' -v
; If your ESPHome device has a different name, replace 'standalone-charger'.

; ── State topics we subscribe to ──
topic_dc_voltage     = standalone-charger/sensor/07_output_dc_voltage/state
topic_dc_current     = standalone-charger/sensor/06_output_dc_current/state
topic_dc_temperature = standalone-charger/sensor/08_output_temperature/state
topic_max_current    = standalone-charger/sensor/09_max_output_dc_current/state
topic_power_state    = standalone-charger/sensor/003_power_state/state
; Last-Will topic — ESPHome publishes 'online'/'offline' here automatically
topic_lwt            = standalone-charger/status

; ── Command topics we publish setpoints to (DVCC) ──
topic_cmd_dc_current_limit = standalone-charger/number/12_set_dc_current_limit/command
topic_cmd_voltage_limit    = standalone-charger/number/10_set_voltage_limit/command


[DVCC]
; Master switch — set to 1 to let Venus DVCC control the charger.
; When 0, driver is read-only (monitoring only), useful for first deployment.
dvcc_control_enabled = 0

; Hard safety caps applied BEFORE forwarding DVCC setpoints to ESPHome.
; If Venus asks for more than the cap, we clamp the published value.
; If Venus asks for ChargeVoltage outside [min, max], we IGNORE the write.
;
; Tune to your battery: e.g. for 16S LFP at 3.5 V/cell max ≈ 56.0 V absorption,
; float around 54.0 V, never below the BMS low-cell cut-off.
max_dc_current_safety = 60
max_dc_voltage_safety = 57.6
min_dc_voltage_safety = 48.0
